name: Release Sonagi CLI

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sonagi-tools
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm & dependencies
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Compile Standalone Binaries with Bun
        run: |
          mkdir -p dist-bin
          cd apps/cli

          # Compile for targets
          bun build --compile --target=bun-darwin-arm64 ./src/index.ts --outfile ../../dist-bin/sonagi-darwin-arm64
          bun build --compile --target=bun-darwin-x64 ./src/index.ts --outfile ../../dist-bin/sonagi-darwin-x64
          bun build --compile --target=bun-linux-arm64 ./src/index.ts --outfile ../../dist-bin/sonagi-linux-arm64
          bun build --compile --target=bun-linux-x64 ./src/index.ts --outfile ../../dist-bin/sonagi-linux-x64

          cd ../../dist-bin
          # Package each into tar.gz with binary named 'sonagi'
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            mkdir -p staging
            cp sonagi-$target staging/sonagi
            chmod +x staging/sonagi
            tar -czvf sonagi-$target.tar.gz -C staging sonagi
            sha256sum sonagi-$target.tar.gz > sonagi-$target.tar.gz.sha256
            rm -rf staging
          done

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist-bin/*.tar.gz
            dist-bin/*.sha256

      - name: Update Homebrew Tap Formula
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        env:
          TAP_TOKEN: ${{ secrets.PAT_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi

          SHA_DARWIN_ARM64=$(awk '{print $1}' dist-bin/sonagi-darwin-arm64.tar.gz.sha256)
          SHA_DARWIN_X64=$(awk '{print $1}' dist-bin/sonagi-darwin-x64.tar.gz.sha256)
          SHA_LINUX_ARM64=$(awk '{print $1}' dist-bin/sonagi-linux-arm64.tar.gz.sha256)
          SHA_LINUX_X64=$(awk '{print $1}' dist-bin/sonagi-linux-x64.tar.gz.sha256)

          # Clone homebrew-tap
          git clone https://x-access-token:${TAP_TOKEN}@github.com/mindulle/homebrew-tap.git tap-repo
          cd tap-repo

          # Update infra/brew/sonagi.rb
          sed -i "s|version \".*\"|version \"$VERSION\"|g" infra/brew/sonagi.rb
          sed -i "s|releases/download/v[0-9.]*|releases/download/v$VERSION|g" infra/brew/sonagi.rb
          sed -i "s|PLACEHOLDER_DARWIN_ARM64_SHA256|$SHA_DARWIN_ARM64|g" infra/brew/sonagi.rb
          sed -i "s|PLACEHOLDER_DARWIN_X64_SHA256|$SHA_DARWIN_X64|g" infra/brew/sonagi.rb
          sed -i "s|PLACEHOLDER_LINUX_ARM64_SHA256|$SHA_LINUX_ARM64|g" infra/brew/sonagi.rb
          sed -i "s|PLACEHOLDER_LINUX_X64_SHA256|$SHA_LINUX_X64|g" infra/brew/sonagi.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/brew/sonagi.rb
          git commit -m "chore(brew): bump sonagi to v$VERSION" || exit 0
          git push origin main
