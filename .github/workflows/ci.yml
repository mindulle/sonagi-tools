name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    services:
      piston:
        image: ghcr.io/mindulle/piston:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}
        ports:
          - 2000:2000
        options: --privileged --tmpfs /tmp:exec
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm run lint

      - name: Check Formatting (Prettier)
        run: npx prettier --check "apps/*/src/**/*.ts" "apps/bots/*/src/**/*.ts" "packages/*/src/**/*.ts"

      - name: Type Check (Build)
        run: pnpm run build

      - name: Run Unit Tests (Vitest)
        run: pnpm run test
